[project]
name = "socratic-hint"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "datasets>=3.0.0",
]

[project.optional-dependencies]
train = [
    "unsloth",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "transformers>=4.46.0",
    "bitsandbytes>=0.44.0",
    "torch>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["gpu: requires a local GPU and trained checkpoint"]
