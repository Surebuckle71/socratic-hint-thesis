[project]
name = "socratic-hint"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "datasets>=3.0.0",
]

[project.optional-dependencies]
train = [
    "unsloth==2026.8.18",
    "peft>=0.13.0",
    # >=0.20: `SFTConfig(max_length=...)` (older TRL called it `max_seq_length`,
    # so a 0.12 resolve crashes at config construction), and prompt/completion
    # datasets auto-resolving `completion_only_loss`. Developed and smoke-tested
    # against 0.24.0.
    "trl>=0.20.0",
    "transformers>=4.46.0",
    "bitsandbytes>=0.44.0",
    "torch>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["gpu: requires a local GPU and trained checkpoint"]
# A bare `pytest` runs the fast suite only. Explicit `-m gpu` on the command
# line overrides this, so GPU tests remain runnable on demand.
addopts = "-m 'not gpu'"
